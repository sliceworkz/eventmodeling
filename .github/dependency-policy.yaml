# The nightly dependency pipeline's policy for this repository (sliceworkz/software-factory, README.md).
# This repository is public and cannot call the pipeline's workflow, so .github/workflows/public-repositories.yaml
# in sliceworkz/software-factory runs it on its behalf; its cron lines there must equal the schedule: lines
# below, character for character (both UTC: 02:10 and 02:40 in Brussels in winter, an hour later in summer).
timezone: Europe/Brussels
ecosystems: [maven]

# true: decide and report only, open no PRs and no issue
dryRun: false

branches:
  develop:
    schedule: "40 1 * * *"
    ownLibraries: follow            # a SNAPSHOT of ours moves to the newest one deployed: that library's develop
    own:        { action: merge,   cooldownDays: 0 }
    patch:      { action: merge,   cooldownDays: 1 }
    minor:      { action: merge,   cooldownDays: 1 }
    major:      { action: pr-each, cooldownDays: 1 }
    transitive: { action: merge,   cooldownDays: 1 }
  "release/*":
    schedule: "10 1 * * *"
    ownLibraries: include           # released versions of our own libraries: updated like any other
    own:        { action: merge,   cooldownDays: 0 }   # a SNAPSHOT of ours becomes the newest release of its line
    patch:      { action: merge,   cooldownDays: 1 }
    minor:      { action: pr,      cooldownDays: 1 }
    major:      { action: mention, cooldownDays: 1 }
    transitive: { action: pr,      cooldownDays: 1 }

ownLibraryCooldownDays: 0
