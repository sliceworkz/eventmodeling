name: auto-assign-issues
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@d11e715efc663fe323c3d8d4d3cbbfdddd539baf #v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: vanrogu