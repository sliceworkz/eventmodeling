name: build-and-deploy-from-release-tag
run-name: "build-and-deploy-from-release-tag [${{ github.ref_name }}]"

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      # to sign the SBOM's build provenance and attest the SBOM to the jars (GitHub artifact attestations)
      id-token: write
      attestations: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      # Grype, the vulnerability scanner, with its database (about 3 GB unpacked) downloading in the
      # background while the build runs; scan.sh waits for it (.github/vulnerability-scan/scan.sh)
      - name: Install Grype
        run: .github/vulnerability-scan/scan.sh install
      - name: Download the vulnerability database
        run: .github/vulnerability-scan/scan.sh prefetch

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Tests run here, against the exact tree being published. The tag is cut by
      # create-release-tag-and-bump, which commits a version change of its own, so the
      # commit this builds is not one any CI run has necessarily seen -- skipping tests
      # here meant nothing ever tested what went to Maven Central.
      - name: Build and test with Maven
        run: mvn -B clean install -Pgpg-ci
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Tests are skipped in THIS step only: 'deploy' re-runs the lifecycle over the
      # same workspace, and the step above already ran the suite against this tree.
      - name: Deploy to Maven Central
        run: mvn -B -DskipTests deploy -Pgpg-ci
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      
      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ steps.get_version.outputs.VERSION }}" \
            --notes "Release version ${{ steps.get_version.outputs.VERSION }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The software bill of materials of this release, as the EU Cyber Resilience Act
      # asks for: the CycloneDX aggregate the Maven build wrote over the runtime library
      # (no test scope), and beside it the test kit's own, kept apart so its JUnit and
      # Testcontainers are not read as dependencies of the library. Each module also
      # carries its own SBOM to the Maven repository, deployed above as its "cyclonedx"
      # classifier.
      - name: Collect the SBOM
        run: |
          mkdir -p sbom
          cp target/bom.json "sbom/sliceworkz-eventmodeling-${{ steps.get_version.outputs.VERSION }}.cdx.json"
          cp sliceworkz-eventmodeling-testing/target/bom.json "sbom/sliceworkz-eventmodeling-testing-${{ steps.get_version.outputs.VERSION }}.cdx.json"

      # Signed build provenance for the SBOM: binds it to this commit and this workflow
      # run, verifiable with 'gh attestation verify <file> --repo sliceworkz/eventmodeling'.
      - name: Attest the SBOM's provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sbom/*.cdx.json

      # The SBOM attested to the jars it describes, so a consumer holding a jar from Maven
      # Central can verify which SBOM belongs to it and that this workflow run produced both:
      #   gh attestation verify <jar> --repo sliceworkz/eventmodeling \
      #     --predicate-type https://cyclonedx.org/bom
      # The library's aggregate goes to the library's jars, the test kit's SBOM to its own.
      - name: Attest the SBOM to the library's jars
        uses: actions/attest@v4
        with:
          sbom-path: sbom/sliceworkz-eventmodeling-${{ steps.get_version.outputs.VERSION }}.cdx.json
          subject-path: |
            sliceworkz-eventmodeling-api/target/sliceworkz-eventmodeling-api-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventmodeling-impl/target/sliceworkz-eventmodeling-impl-${{ steps.get_version.outputs.VERSION }}.jar

      - name: Attest the test kit's SBOM to its jar
        uses: actions/attest@v4
        with:
          sbom-path: sbom/sliceworkz-eventmodeling-testing-${{ steps.get_version.outputs.VERSION }}.cdx.json
          subject-path: sliceworkz-eventmodeling-testing/target/sliceworkz-eventmodeling-testing-${{ steps.get_version.outputs.VERSION }}.jar

      # Report only: the gate ran before the tag was created (create-release-tag-and-bump), and a release
      # that is already tagged is not stopped here. The findings are in the job summary and the
      # vulnerability-reports artifact.
      - name: Report known vulnerabilities in the release
        continue-on-error: true
        run: |
          for sbom in sbom/*.cdx.json; do
            .github/vulnerability-scan/scan.sh report "$sbom" "$(basename "$sbom" .cdx.json)"
          done
      - name: Keep the vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-reports
          path: ${{ runner.temp }}/vulnerability-scan/reports/
          if-no-files-found: ignore

      - name: Attach the SBOM to the GitHub release
        run: gh release upload ${{ github.ref_name }} sbom/*.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
