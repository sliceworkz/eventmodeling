name: build-and-deploy-snapshot-cloudrepo

run-name: "build-and-deploy-snapshot-cloudrepo [${{ github.ref_name }}]"

# Manually triggered. Pick the branch to build from via the "Use workflow from"
# selector in the GitHub UI (or the `ref` when dispatched through the API/CLI) —
# the checkout below builds exactly that ref.
#
# Runs on the runner host (no container) and installs Maven 4 explicitly: this is
# the Maven 4 branch (4.1.0 model), and a job container would put setup-java's
# ~/.m2/settings.xml (cloudrepo credentials) under /github/home while the image
# uses /root/.m2, causing an HTTP 401 on deploy. On the host they agree.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_VERSION: 4.0.0-rc-7

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job-wide rather than per-step: the cloudrepo is where this project RESOLVES the
    # eventstore SNAPSHOTs from as well as where it deploys to (see the <repositories>
    # entry in the root POM), so setup-java's ${env.CLOUDREPO_*} placeholders have to be
    # filled in for every mvn invocation. With them only on the deploy step, the version
    # check below sent the literal placeholder as its username and died on an HTTP 401
    # while reading sliceworkz-eventstore-bom.
    env:
      CLOUDREPO_USERNAME: ${{ secrets.CLOUDREPO_USERNAME }}
      CLOUDREPO_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: cloudrepo
          server-username: CLOUDREPO_USERNAME
          server-password: CLOUDREPO_PASSWORD

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn -version

      - name: Verify SNAPSHOT version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --raw-streams)
          echo "Current version: $CURRENT_VERSION"
          if [[ ! "$CURRENT_VERSION" =~ -SNAPSHOT$ ]]; then
            echo "Error: Version $CURRENT_VERSION is not a SNAPSHOT version"
            echo "This workflow only publishes SNAPSHOT builds to cloudrepo."
            exit 1
          fi

      # No -DskipTests: the SNAPSHOTs published here are what the downstream projects
      # resolve and build against, so they are tested before they are pushed.
      - name: Build and deploy to cloudrepo
        run: mvn -B -Pcloudrepo clean deploy
