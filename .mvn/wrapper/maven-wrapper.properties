# the Central bundle, which Central rejects with "Bundle has content that does NOT have a
# .pom file". See https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
# Move to Maven 3.10.x once a plugin release fixes that, and bump the plugin with it.
